<!-- Reusable Component Showcase Block -->
<div x-data="{ 
  tab: 'preview', 
  copied: false,
  copyCode() {
    const rawCode = this.$refs.codeBlock.innerText;
    navigator.clipboard.writeText(rawCode);
    this.copied = true;
    setTimeout(() => this.copied = false, 2000);
  }
}" class="rounded-3xl border border-slate-800 bg-slate-900/50 backdrop-blur-xl overflow-hidden shadow-2xl">
  
  <!-- Component Control Header Bar -->
  <div class="px-6 py-4 border-b border-slate-800 bg-slate-950/80 flex items-center justify-between gap-4">
    
    <!-- Left: Title & Tab Switcher -->
    <div class="flex items-center gap-4">
      <div class="flex items-center p-1 bg-slate-900 rounded-xl border border-slate-800">
        <button 
          @click="tab = 'preview'" 
          :class="tab === 'preview' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" 
          class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-lg transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          Preview
        </button>
        <button 
          @click="tab = 'code'" 
          :class="tab === 'code' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'" 
          class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-lg transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
          HTML Code
        </button>
      </div>
    </div>

    <!-- Right: Copy Code Button -->
    <button 
      @click="copyCode()" 
      class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-xs font-semibold text-slate-300 hover:bg-slate-800 hover:text-white transition active:scale-95">
      
      <!-- Copy Icon -->
      <svg x-show="!copied" class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>
      
      <!-- Checkmark Icon on Success -->
      <svg x-show="copied" x-cloak class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
      </svg>

      <span x-text="copied ? 'Copied to Clipboard!' : 'Copy Code'" :class="copied ? 'text-emerald-400 font-bold' : ''"></span>
    </button>
  </div>

  <!-- TAB 1: LIVE INTERACTIVE PREVIEW -->
  <div x-show="tab === 'preview'" class="p-6 sm:p-10 bg-slate-950/40">
    <!-- Place the live component HTML code here -->
    <button class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-semibold">Live Preview Element</button>
  </div>

  <!-- TAB 2: RAW SOURCE CODE VIEWPORT -->
  <div x-show="tab === 'code'" x-cloak class="bg-slate-950 p-6 overflow-x-auto border-t border-slate-800/80">
    <pre class="font-mono text-xs leading-relaxed text-slate-300"><code x-ref="codeBlock">&lt;button class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-semibold"&gt;Live Preview Element&lt;/button&gt;</code></pre>
  </div>

</div>
